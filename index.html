<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PutzFee">
  <title>PutzFee</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">🧚 PutzFee <span class="proto">Prototyp</span></div>
    <div class="zeit">
      <button data-action="tag" data-d="-1" aria-label="Einen Tag zurück">◀</button>
      <span id="datum"></span>
      <button data-action="tag" data-d="1" aria-label="Einen Tag vor">▶</button>
      <button data-action="tag" data-d="7">+1 Woche</button>
      <button data-action="heute">Heute</button>
    </div>
    <div id="gesamt" class="gesamt"></div>
    <button class="rund" data-action="menue" aria-label="Menü">☰</button>
  </header>
  <div id="menue" class="menue">
    <button data-action="sichern">💾 Sichern <small>Alle Daten als Datei speichern</small></button>
    <button data-action="wiederherstellen">📂 Wiederherstellen <small>Sicherung laden (ersetzt alles)</small></button>
    <button data-action="leeren">🧹 Haus leeren <small>Aufgaben und Deko löschen, selbst einrichten</small></button>
    <div id="installieren" class="menue-info"></div>
    <div id="version" class="menue-info"></div>
  </div>
  <input id="datei-import" type="file" accept=".json,application/json" data-change="import" hidden>
  <main class="buehne">
    <div id="haus"></div>
    <div id="vorschau" class="vorschau-banner"></div>
    <aside id="panel" class="panel"></aside>
    <div class="hinweis">Raum oder Möbelstück antippen · mit ▶ in die Zukunft schauen (Vorschau)</div>
  </main>

  <script src="js/version.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/moebel.js"></script>
  <script src="js/haus.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
